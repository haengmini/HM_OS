name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package release artifact
        run: |
          tar -czf "hm-os-${GITHUB_REF_NAME}.tar.gz" \
            apps/api/dist apps/web/dist scripts config ecosystem.config.cjs \
            package.json package-lock.json README.md docs/operations
          sha256sum "hm-os-${GITHUB_REF_NAME}.tar.gz" > "hm-os-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "hm-os-${GITHUB_REF_NAME}.tar.gz" \
            "hm-os-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --title "HM OS $GITHUB_REF_NAME" \
            --generate-notes
